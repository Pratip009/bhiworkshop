<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome to BHI Workshop</title>
</head>
<body style="margin:0; padding:0; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f4f7; color: #333;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f4f4f7">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="margin:20px auto; border-radius:8px; overflow:hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.05);">
          <!-- Header -->
          <tr>
            <td align="center" bgcolor="#57B4BA" style="padding: 30px 20px;">
              <h1 style="color: #ffffff; font-size: 28px; margin:0;">Welcome to Your Academy</h1>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding: 40px 30px 20px 30px;">
              <h2 style="color:#333333; font-size: 24px; margin-top:0;">Hello, {{username}}!</h2>
              <p style="font-size:16px; line-height:1.6; color:#555555; margin-bottom:20px;">
                Thank you for registering at <strong>BHI Workshop</strong>. We're thrilled to have you on board.
              </p>
              <p style="font-size:16px; line-height:1.6; color:#555555; margin-bottom:20px;">
                Get ready to explore our courses and workshops designed to help you learn and grow.
              </p>
              <p style="font-size:16px; line-height:1.6; color:#555555;">
                Cheers,<br>
                <strong>The BHI Workshop Team</strong>
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" bgcolor="#f4f4f7" style="padding: 20px; font-size:12px; color:#999999;">
              <p style="margin:0;">&copy; {{year}} BHI Workshop. All rights reserved.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
